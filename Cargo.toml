[package]
name = "tartarus"
description = "Screen overlay for Tartarus Prison in Torchlight: Infinite: boxes the best choice (read-only advice; never plays the game)"
version = "0.15.4"
edition = "2021"
license = "MIT"

[[bin]]
name = "tartarus-overlay"
path = "src/bin/tartarus-overlay.rs"

[features]
# no console, nothing written to disk, only the boxes
default = ["lite"]
lite = []

[build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
rayon = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
